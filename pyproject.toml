[project]
name = "ieee-spider"
version = "0.2.1"
description = "Metadata and authorized full-text collection tool for IEEE publications"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.55.0",
]

[project.scripts]
ieee-spider = "ieee_spider.cli:main"

[dependency-groups]
dev = [
    "nuitka==4.1.3",
    "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ieee_spider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
