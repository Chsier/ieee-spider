interface:
  display_name: "IEEE Spider"
  short_description: "IEEE collections, citation stats, DOCX summaries"
  default_prompt: "Use $ieee-spider through its embedded scripts/ieee-spider.ps1 runtime for IEEE Xplore search, per-author collections, manifest-driven downloads, serial enrichment, citation statistics, and DOCX summaries. Require a human to complete the initial login and require live session confirmation; stop the batch on sign-in or stale-session failures. Keep network access direct by default; only explicit per-record PDF proxy rules may opt a link into a user-supplied proxy. Never run parallel IEEE browser pages or fall back to another metadata source."
